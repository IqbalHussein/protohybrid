name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # The build only needs these to exist; nothing is contacted at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  migrations:
    name: Migrations against Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker is preinstalled on GitHub's Ubuntu runners, which is all the
      # script needs.
      - run: ./scripts/check-migrations.sh
